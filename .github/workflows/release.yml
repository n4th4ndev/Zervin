name: Release

# Builds Zevrin for macOS (Apple silicon and Intel) and Windows, and publishes the installers to the GitHub
# Release of the tag. Push a tag such as v0.1.0 (matching package.json "version"), or run it by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A Release needs its tag: when the workflow is started by hand, tag the commit with v<package.json version>.
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists"
          else
            git tag "$TAG" && git push origin "$TAG"
          fi

  build:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: --mac --arm64 --x64
          - os: windows-latest
            target: --win --x64 --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Tests run in the CI workflow on Linux; some fixtures assume Unix paths and no Xcode.
      - run: npm run build
      - name: Package and publish
        run: npx electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The app is not code-signed yet.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
